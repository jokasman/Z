name: Compilar APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Testes da lógica do jogo
        run: |
          mkdir -p build/test
          javac -encoding UTF-8 -d build/test src/pt/setorzero/core/*.java test/SimTest.java
          java -cp build/test pt.setorzero.core.SimTest | tee build/test/out.txt
          grep -q "ALL PASS" build/test/out.txt

      - name: Instalar Android SDK (build-tools e plataforma)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null

      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KS_PASS" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
            chmod 600 release.jks
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "A usar a chave dos Repository secrets."
          else
            TMP_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$TMP_PASS"
            echo "KS_PASS=$TMP_PASS" >> "$GITHUB_ENV"
            echo "::warning::Sem KEYSTORE_BASE64/KS_PASS nos secrets: o APK é assinado com uma chave temporária. Para instalar uma versão nova por cima da anterior, desinstale primeiro (ou configure os secrets)."
          fi

      - name: Compilar APK
        run: bash ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SetorZero-apk
          path: build/SetorZero.apk
          if-no-files-found: error

      - name: Remover chave
        if: always()
        run: rm -f release.jks
