name: Compilar APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Testes da lógica do jogo
        run: |
          mkdir -p build/test
          javac -encoding UTF-8 -d build/test src/pt/setorzero/core/*.java test/SimTest.java test/NetTest.java test/DesktopGfx.java
          java -cp build/test pt.setorzero.core.SimTest | tee build/test/out.txt
          grep -q "ALL PASS" build/test/out.txt
          java -Djava.awt.headless=true -cp build/test pt.setorzero.core.NetTest | tee build/test/net.txt
          grep -q "ALL PASS" build/test/net.txt

      - name: Instalar Android SDK (build-tools e plataforma)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null

      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KS_PASS" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
            chmod 600 release.jks
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "A usar a chave dos Repository secrets."
          else
            TMP_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$TMP_PASS"
            echo "KS_PASS=$TMP_PASS" >> "$GITHUB_ENV"
            echo "::warning::Sem KEYSTORE_BASE64/KS_PASS nos secrets: o APK é assinado com uma chave temporária. Para instalar uma versão nova por cima da anterior, desinstale primeiro (ou configure os secrets)."
          fi

      - name: Compilar APK
        run: bash ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SetorZero-apk
          path: build/SetorZero.apk
          if-no-files-found: error

      - name: Remover chave
        if: always()
        run: rm -f release.jks

      - name: Publicar na Release (link direto)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(grep -o 'android:versionName="[^"]*"' AndroidManifest.xml | cut -d'"' -f2)"
          # SetorZero.apk dá um link fixo: releases/latest/download/SetorZero.apk
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" build/SetorZero.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/SetorZero.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Setor Zero $TAG" \
              --notes "APK do Setor Zero. Para instalar, descarregue SetorZero.apk e abra-o no telemóvel (Android 8.0 ou superior)." \
              --latest
          fi
